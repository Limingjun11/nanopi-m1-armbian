name: image-armbian

# "Armbian userland + our mainline kernel":
# take the last archived Armbian image for the NanoPi M1 (21.08.1, bullseye,
# kernel 5.10.60), keep its rootfs (armbian-config, armbian-firstrun, ...) and
# replace kernel / modules / dtb / boot loader with our 6.18 build.
#
# Armbian marked this board EOS, so this is the only way to get its userland
# on a current kernel.

on:
  # Every Monday 03:00 Asia/Shanghai (Sunday 19:00 UTC)
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Linux version (e.g. 6.18.64)'
        required: false
        default: '6.18.64'
      img_size:
        description: 'Raw image size (needs room for the Armbian rootfs)'
        required: false
        default: '4G'

permissions:
  contents: write

concurrency:
  group: image-armbian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: armbian + linux ${{ inputs.kernel_version || '6.18.64' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      KERNEL_VERSION: ${{ inputs.kernel_version || '6.18.64' }}
      IMG_SIZE: ${{ inputs.img_size || '4G' }}
      DISTRO: armbian
      UBOOT_VERSION: '2026.07'
      UBOOT_URL: https://github.com/u-boot/u-boot/archive/refs/tags/v2026.07.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex bc libssl-dev swig python3-dev patch \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            e2fsprogs util-linux xz-utils qemu-system-arm

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: .cache/dl
          key: armbian-dl-${{ env.KERNEL_VERSION }}-${{ hashFiles('nanopi-m1-kernel/scripts/build.sh', 'nanopi-m1-image/scripts/rootfs-armbian.sh') }}
          restore-keys: |
            armbian-dl-${{ env.KERNEL_VERSION }}-
            armbian-dl-

      - name: Build kernel and U-Boot
        run: make -C nanopi-m1-image kernel uboot

      - name: Extract Armbian rootfs and swap the kernel
        run: ./nanopi-m1-image/scripts/rootfs-armbian.sh

      - name: Hand rootfs to root (mke2fs copies ownership)
        run: sudo chown -R 0:0 .cache/work-image/rootfs

      - name: Assemble image (root)
        run: sudo env "PATH=$PATH" DISTRO=armbian make -C nanopi-m1-image image

      - name: Hand output back to runner
        run: sudo chown -R "$(id -u):$(id -g)" nanopi-m1-image/out

      - name: Verify image layout
        run: ./nanopi-m1-image/scripts/inspect.sh nanopi-m1-image/out/nanopi-m1-*-armbian.img

      - name: Boot test in QEMU
        run: make -C nanopi-m1-image test

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-m1-armbian-image
          if-no-files-found: error
          retention-days: 30
          path: |
            nanopi-m1-image/out/nanopi-m1-*-armbian.img.xz
            nanopi-m1-image/out/u-boot-sunxi-with-spl.bin
            nanopi-m1-image/out/manifest.txt

      - name: Compute release tag
        id: meta
        run: |
          echo "tag=weekly-armbian-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "name=NanoPi M1 armbian weekly build $(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Remove release with the same tag (re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.meta.outputs.tag }}" --yes --cleanup-tag || true

      - name: Publish weekly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          files: |
            nanopi-m1-image/out/nanopi-m1-*-armbian.img.xz
            nanopi-m1-image/out/manifest.txt
          body: |
            NanoPi M1 (Allwinner H3) - Armbian userland + mainline kernel

            * userland: Armbian 21.08.1 (Debian bullseye, armhf)
            * U-Boot 2026.07
            * Linux ${{ env.KERNEL_VERSION }} (LTS) + sun8i-h3-nanopi-m1 dtb
            * default credentials: `root` / `nanopi`
            * serial console: `ttyS0 115200 8N1`

            The Armbian first-boot wizard is disabled; networking is plain DHCP
            on eth0.

            Flash with:

            ```
            xz -dc nanopi-m1-*.img.xz | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync
            ```

      - name: Prune old weekly releases (keep 4)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName \
            --jq '.[] | select(.tagName | startswith("weekly-armbian-")) | .tagName' \
            | tail -n +5 \
            | while read -r t; do
                echo "deleting $t"
                gh release delete "$t" --yes --cleanup-tag || true
              done
